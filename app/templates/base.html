<!DOCTYPE html>
<!-- base.html : shared layout. Every page extends this. Put in /templates -->
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}M&K Nexus Cloud{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body{background:radial-gradient(1200px 600px at 10% -10%,rgba(34,211,238,.10),transparent),radial-gradient(900px 500px at 100% 0,rgba(16,185,129,.08),transparent),#020617}
    .glass{backdrop-filter:blur(12px);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:.75rem}
    .inp{width:100%;background:rgba(2,6,23,.6);border:1px solid rgba(255,255,255,.12);border-radius:.5rem;padding:.6rem .8rem;color:#e2e8f0;outline:none;transition:.15s}
    .inp:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.18)}
    .btn{background:linear-gradient(90deg,#06b6d4,#10b981);color:#020617;font-weight:600;border-radius:.5rem;padding:.6rem 1rem;transition:.15s}
    .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
    .btn2{border:1px solid rgba(255,255,255,.15);border-radius:.5rem;padding:.5rem .9rem;color:#cbd5e1;transition:.15s}.btn2:hover{background:rgba(255,255,255,.08)}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body class="text-slate-200 min-h-screen antialiased">
  <!-- Flash toasts (Flask flash categories: success, danger, warning, info) -->
  <div class="fixed top-4 right-4 z-50 space-y-2 w-80">
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}
    <div class="glass p-3 text-sm border-l-4 {{ {'success':'border-emerald-400','danger':'border-red-500','warning':'border-amber-400'}.get(cat,'border-cyan-400') }}" onclick="this.remove()">{{ m }}</div>
  {% endfor %}{% endwith %}
  </div>
  {% block content %}{% endblock %}
  <script>lucide.createIcons();</script>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
