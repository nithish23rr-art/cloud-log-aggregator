{% extends "base.html" %}
{% block title %}Set new password — M&K Nexus Cloud{% endblock %}
{% block content %}
<main class="min-h-screen grid place-items-center p-5">
  <form method="POST" action="{{ url_for('reset_password') }}" id="f" class="glass p-8 w-full max-w-sm space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="text-center"><i data-lucide="lock-keyhole" class="mx-auto text-emerald-400 w-9 h-9"></i><h1 class="mt-2 text-xl font-semibold text-white">Set a new password</h1></div>
    <div><label class="text-xs text-slate-400">Username</label><input class="inp mt-1" name="username" required></div>
    <div><label class="text-xs text-slate-400">New password (8+ characters)</label><input id="p1" class="inp mt-1" type="password" name="password" required minlength="8" autocomplete="new-password"></div>
    <div><label class="text-xs text-slate-400">Confirm password</label><input id="p2" class="inp mt-1" type="password" name="confirm" required autocomplete="new-password"></div>
    <p id="err" class="text-xs text-red-400 hidden">Passwords do not match.</p>
    <button class="btn w-full">Update password</button>
  </form>
</main>
{% endblock %}
{% block scripts %}<script>
document.getElementById('f').addEventListener('submit',e=>{if(p1.value!==p2.value){e.preventDefault();document.getElementById('err').classList.remove('hidden');}});
</script>{% endblock %}
