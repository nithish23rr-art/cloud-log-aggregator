<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login - Enterprise Cloud Log Aggregator</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="card border-0 shadow-lg p-4 rounded-4 bg-white" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <div class="mb-3">
                <i class="bi bi-shield-lock-fill text-primary display-5"></i>
            </div>
            <h3 class="fw-bold text-dark">Cloud Log Center</h3>
            <p class="text-muted small">Enterprise Security & Log Monitoring Portal</p>
        </div>
        
        <!-- Flash Messages for Errors -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger py-2 small rounded-3" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 bg-light" id="username" name="username" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 bg-light" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Sign In to Dashboard</button>
        </form>
        
        <div class="text-center mt-4 border-top pt-3">
            <p class="text-muted small mb-0">Don't have an enterprise account? <a href="/signup" class="text-decoration-none fw-semibold">Sign up</a></p>
        </div>
    </div>
</body>
</html>
