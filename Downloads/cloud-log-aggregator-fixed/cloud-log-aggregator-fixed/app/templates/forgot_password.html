
{% extends "base.html" %}
{% block title %}Reset password — M&K Nexus Cloud{% endblock %}
{% block content %}
<main class="min-h-screen grid place-items-center p-5">
  <!-- You must add a /forgot_password route in app.py (GET renders, POST handles) -->
  <form method="POST" action="/forgot_password" class="glass p-8 w-full max-w-sm space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="text-center"><i data-lucide="key-round" class="mx-auto text-cyan-400 w-9 h-9"></i><h1 class="mt-2 text-xl font-semibold text-white">Reset your password</h1><p class="text-xs text-slate-400 mt-1">Enter your account email. We will send a verification code.</p></div>
    <input class="inp" type="email" name="email" placeholder="you@company.com" required>
    <button class="btn w-full">Send reset code</button>
    <a class="block text-center text-xs text-slate-400 hover:text-cyan-300" href="{{ url_for('login') }}">Back to sign in</a>
  </form>
</main>
{% endblock %}
