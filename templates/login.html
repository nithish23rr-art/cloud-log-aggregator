<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - M&K Nexus Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border-radius: 1.5rem; padding: 2.5rem; width: 100%; max-width: 420px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow mb-2" style="width: 50px; height: 50px; font-weight: 800; font-size: 1.3rem;">M&K</div>
            <h3 class="fw-bold text-white">Welcome Back</h3>
            <p class="text-muted small">Sign in to M&K Nexus Cloud Intelligence</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label small text-muted fw-semibold">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control bg-dark border-secondary text-light" placeholder="Enter username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted fw-semibold">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-dark border-secondary text-light" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 shadow-sm mb-3">Sign In to Dashboard</button>
            <div class="text-center">
                <p class="small text-muted mb-0">Don't have an account? <a href="/signup" class="text-primary text-decoration-none fw-semibold">Create account</a></p>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
